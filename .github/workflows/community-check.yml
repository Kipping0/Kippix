# Checks an upload sent from Kippix (a pull request) before you approve it: only files in community/, readable JSON, sensible
# sizes and safe paths. It uses the checker from main, not one the pull request could change.
name: Community upload check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the upload
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git fetch origin "${{ github.base_ref }}"
          git show "origin/${{ github.base_ref }}:.github/scripts/community_check.py" > "$RUNNER_TEMP/community_check.py"
          python3 "$RUNNER_TEMP/community_check.py" "origin/${{ github.base_ref }}" "$AUTHOR"
